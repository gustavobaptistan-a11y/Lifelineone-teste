version: '3.8'

services:
  db:
    image: postgres:13-alpine
    container_name: lifeline_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-lifeline}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    networks:
      - lifeline_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-lifeline}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-evo:
    image: postgres:15
    container_name: lifeline_evolution_db
    environment:
      POSTGRES_USER: ${POSTGRES_EVO_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_EVO_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_evo_data:/var/lib/postgresql/data
    networks:
      - lifeline_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_EVO_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2-alpine
    container_name: lifeline_redis
    ports:
      - "6379:6379"
    networks:
      - lifeline_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: lifeline_evolution_go
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-sua-chave-segura-aqui}
      POSTGRES_AUTH_DB: postgresql://postgres:password@postgres-evo:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://postgres:password@postgres-evo:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: INFO
      LOGTYPE: console
    depends_on:
      - postgres-evo
    restart: unless-stopped
    networks:
      - lifeline_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lifeline_app
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-go:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lifeline_net

volumes:
  postgres_data:
  postgres_evo_data:

networks:
  lifeline_net:
    driver: bridge